<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图图助手 · 幻彩</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       全局 · 渐变天空 + 动态光晕
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(145deg, #f9e7f2 0%, #e0d9ff 30%, #c5e8f7 60%, #d4f0e6 85%, #f5e6d3 100%);
      background-size: 200% 200%;
      animation: gradientShift 20s ease-in-out infinite alternate;
      position: relative;
      overflow: hidden;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before,
    body::after,
    .glow-orbe-1,
    .glow-orbe-2 {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.3;
    }
    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #f9a8d4, transparent 70%);
      top: -150px;
      left: -100px;
      animation: floatOrbe 16s ease-in-out infinite alternate;
    }
    body::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #8ecae6, transparent 70%);
      bottom: -100px;
      right: -80px;
      animation: floatOrbe 14s ease-in-out infinite alternate-reverse;
    }
    .glow-orbe-1 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #b9a6f0, transparent 70%);
      top: 30%;
      right: 10%;
      animation: floatOrbe 18s ease-in-out infinite alternate;
    }
    .glow-orbe-2 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #fcd34d, transparent 70%);
      bottom: 20%;
      left: 5%;
      animation: floatOrbe 12s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatOrbe {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.2); }
    }

    /* ============================================================
       滚动条 · 极细柔光灰
       ============================================================ */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      transition: background 0.3s;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
    }

    /* ============================================================
       主容器
       ============================================================ */
    .app {
      display: flex;
      width: 100%;
      max-width: 1380px;
      height: 92vh;
      max-height: 960px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow:
        0 40px 100px -24px rgba(0, 0, 0, 0.08),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      overflow: hidden;
      position: relative;
      z-index: 10;
      transition: box-shadow 0.4s;
    }
    .app:hover {
      box-shadow: 0 50px 120px -28px rgba(0, 0, 0, 0.12);
    }

    .app::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 48px;
      padding: 1px;
      background: conic-gradient(from 0deg, #f9a8d4, #8ecae6, #b9a6f0, #fcd34d, #f9a8d4);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 20;
      opacity: 0.15;
      transition: opacity 0.6s;
    }
    .app:hover::after { opacity: 0.4; }

    /* ============================================================
       侧边栏
       ============================================================ */
    .sidebar {
      width: 210px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 34px 18px 24px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 21px;
      font-weight: 600;
      color: #2d1b2b;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
    }
    .logo .accent {
      font-weight: 350;
      font-size: 10px;
      color: #6f5a6b;
      letter-spacing: 0.8px;
      background: rgba(255,255,255,0.1);
      padding: 2px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.05);
      text-transform: uppercase;
    }
    .logo .icon-mark {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #f9a8d4, #8ecae6, #b9a6f0);
      margin-left: auto;
      opacity: 0.6;
    }

    .version-badge {
      font-size: 10px;
      color: #8f7a8b;
      margin: 0 0 34px 4px;
      letter-spacing: 0.6px;
      font-weight: 400;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: #6f5a6b;
      border-radius: 14px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      margin-bottom: 2px;
      width: 100%;
      text-align: left;
      position: relative;
    }
    .nav-btn .icon { font-size: 18px; width: 26px; opacity: 0.5; transition: all 0.3s; }
    .nav-btn[data-page="bw"] .icon { color: #f9a8d4; }
    .nav-btn[data-page="format"] .icon { color: #8ecae6; }
    .nav-btn[data-page="ocr"] .icon { color: #b9a6f0; }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #2d1b2b;
      transform: translateX(4px);
    }
    .nav-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #2d1b2b;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }
    .nav-btn.active .icon { opacity: 1; }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      right: 12px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #f9a8d4, #8ecae6, #b9a6f0);
      opacity: 0.6;
    }

    .sidebar-spacer { flex: 1; }
    .sidebar-footer {
      font-size: 10px;
      color: #8f7a8b;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 16px;
      margin-top: 8px;
      letter-spacing: 0.4px;
      font-weight: 400;
      opacity: 0.6;
    }

    /* ============================================================
       主内容
       ============================================================ */
    .main {
      flex: 1;
      padding: 28px 38px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: transparent;
      position: relative;
      z-index: 2;
    }

    .page-title {
      font-size: 26px;
      font-weight: 600;
      color: #2d1b2b;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 4px;
    }
    .page-title .glow {
      font-size: 10.5px;
      font-weight: 450;
      color: #8f7a8b;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      letter-spacing: 0.6px;
      transition: all 0.3s;
    }

    /* ============================================================
       卡片 - 取消卡片自身的transform，避免点击漂移
       ============================================================ */
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 4px 24px -6px rgba(0, 0, 0, 0.02),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      padding: 20px 24px;
      transition: box-shadow 0.4s, border-color 0.3s;
      position: relative;
      overflow: visible;
      /* 移除 transform，防止点击漂移 */
    }
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #f9a8d4, #8ecae6, #b9a6f0, transparent);
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none; /* 不干扰点击 */
    }
    .card:hover::after { opacity: 0.6; }
    .card:hover {
      box-shadow:
        0 16px 48px -16px rgba(0, 0, 0, 0.04),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      /* 不再使用 transform: translateY(-2px)，避免点击漂移 */
    }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      color: #8f7a8b;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title .badge-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #f9a8d4, #8ecae6, #b9a6f0);
      opacity: 0.6;
    }

    /* ============================================================
       文件拖放区
       ============================================================ */
    .file-drop-area {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      color: #8f7a8b;
      cursor: pointer;
      transition: all 0.4s ease;
      background: rgba(255, 255, 255, 0.05);
    }
    .file-drop-area:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }
    .file-drop-area.dragover {
      border-color: #b9a6f0;
      background: rgba(185, 166, 240, 0.04);
      box-shadow: 0 0 40px rgba(185, 166, 240, 0.04);
    }
    .file-drop-area .icon-big {
      font-size: 30px;
      display: block;
      margin-bottom: 4px;
      opacity: 0.3;
      transition: all 0.4s;
    }
    .file-drop-area:hover .icon-big { opacity: 0.6; transform: scale(1.05) rotate(-2deg); }
    .file-drop-area .hint { font-size: 13.5px; font-weight: 400; }

    .file-list {
      max-height: 110px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin: 12px 0 6px;
      font-size: 13px;
      color: #3d2b3a;
    }
    .file-list::-webkit-scrollbar { width: 3px; }
    .file-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }

    .file-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .file-item:last-child { border: none; }
    .file-item .size { color: #8f7a8b; font-size: 11px; }

    /* ============================================================
       按钮组
       ============================================================ */
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 2px;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 22px;
      border: none;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      background: rgba(255, 255, 255, 0.15);
      color: #3d2b3a;
      border: 1px solid rgba(255, 255, 255, 0.05);
      letter-spacing: 0.2px;
      position: relative;
      overflow: visible;
      white-space: nowrap;
      flex: 0 0 auto;
      min-width: fit-content;
    }
    /* 确保伪元素不干扰点击 */
    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.12) 50%, transparent 60%);
      transform: rotate(25deg) translateX(-100%);
      transition: transform 0.8s;
      pointer-events: none; /* 关键：不阻挡点击 */
    }
    .btn:hover::after { transform: rotate(25deg) translateX(100%); }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px -8px rgba(0, 0, 0, 0.04);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f9a8d4, #b9a6f0);
      color: #fff;
      border: none;
      box-shadow: 0 4px 20px -4px rgba(185, 166, 240, 0.25);
    }
    .btn-primary::after {
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #fbb6dc, #c8b8f5);
      box-shadow: 0 12px 36px -8px rgba(185, 166, 240, 0.35);
      transform: translateY(-3px);
      border: none;
    }
    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn-primary:disabled::after { display: none; }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #6f5a6b;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .btn-danger {
      border-color: rgba(255, 200, 200, 0.1);
      color: #b08888;
    }
    .btn-danger:hover {
      background: rgba(255, 240, 240, 0.1);
      border-color: rgba(255, 200, 200, 0.2);
      color: #8a6a6a;
    }

    .file-count {
      font-size: 12px;
      color: #8f7a8b;
      margin-top: 6px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* ============================================================
       参数控件 - 增大点击区域
       ============================================================ */
    .param-row { margin: 14px 0 6px; }
    .param-label {
      font-size: 10px;
      font-weight: 600;
      color: #8f7a8b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: block;
      margin-bottom: 8px;
    }
    .param-group {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 32px;
      align-items: center;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .radio-group label {
      font-size: 13px;
      color: #3d2b3a;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.2s;
      font-weight: 400;
      white-space: nowrap;
      padding: 4px 6px;  /* 增加点击热区 */
      border-radius: 6px;
    }
    .radio-group label:hover { color: #2d1b2b; background: rgba(255,255,255,0.05); }
    .radio-group input[type="radio"] {
      accent-color: #b9a6f0;
      width: 18px;   /* 增大尺寸 */
      height: 18px;
      cursor: pointer;
      margin: 0;
      flex-shrink: 0;
    }

    input[type="range"] {
      width: 200px;
      accent-color: #b9a6f0;
      background: transparent;
      cursor: pointer;
      height: 3px;
      border-radius: 10px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #b9a6f0;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      margin-top: -7.5px;
      cursor: pointer;
      transition: 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.08);
      border-color: #8ecae6;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .range-value {
      font-size: 15px;
      font-weight: 500;
      color: #2d1b2b;
      min-width: 30px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 28px;
      margin: 6px 0;
    }
    .checkbox-group label {
      font-size: 13px;
      color: #3d2b3a;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.2s;
      font-weight: 400;
      white-space: nowrap;
      padding: 4px 6px;  /* 增加点击热区 */
      border-radius: 6px;
    }
    .checkbox-group label:hover { color: #2d1b2b; background: rgba(255,255,255,0.05); }
    .checkbox-group input[type="checkbox"] {
      accent-color: #b9a6f0;
      width: 18px;   /* 增大尺寸 */
      height: 18px;
      cursor: pointer;
      margin: 0;
      flex-shrink: 0;
    }

    /* 下拉菜单 - 增大尺寸 */
    select {
      padding: 10px 24px;  /* 增加内边距 */
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.08);
      color: #2d1b2b;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 400;
      min-width: 140px;
      width: auto;
      max-width: 100%;
      min-height: 44px;  /* 增大触控区域 */
    }
    select:focus { border-color: #b9a6f0; background: rgba(255, 255, 255, 0.15); }
    select:hover { border-color: rgba(255, 255, 255, 0.15); }

    .hint-text {
      font-size: 12px;
      color: #8f7a8b;
      margin-top: 6px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* ============================================================
       预览区域
       ============================================================ */
    .preview-area {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 14px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      min-height: 76px;
      align-items: flex-start;
    }
    .preview-item {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 8px;
      width: 108px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 2px 12px -4px rgba(0,0,0,0.01);
    }
    .preview-item:nth-child(3n+1) { border-color: rgba(249, 168, 212, 0.15); }
    .preview-item:nth-child(3n+2) { border-color: rgba(142, 202, 230, 0.15); }
    .preview-item:nth-child(3n+3) { border-color: rgba(185, 166, 240, 0.15); }
    .preview-item:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.04);
    }
    .preview-item img {
      max-width: 100%;
      max-height: 76px;
      border-radius: 10px;
      display: block;
      margin: 0 auto 4px;
      background: rgba(255, 255, 255, 0.05);
    }
    .preview-item .pname {
      font-size: 10px;
      color: #8f7a8b;
      word-break: break-all;
      line-height: 1.3;
      font-weight: 400;
    }
    .empty-preview {
      padding: 14px 0;
      color: #8f7a8b;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* ============================================================
       底部状态
       ============================================================ */
    .status-bar {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #8f7a8b;
      font-weight: 400;
    }
    .status-bar .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.4s;
    }
    .status-dot.active {
      background: conic-gradient(from 0deg, #f9a8d4, #8ecae6, #b9a6f0);
      box-shadow: 0 0 0 3px rgba(185, 166, 240, 0.1);
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 780px) {
      .app { flex-direction: column; height: auto; max-height: 98vh; border-radius: 32px; }
      .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; padding: 16px 20px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; gap: 4px; background: rgba(255,255,255,0.05); }
      .logo { font-size: 18px; margin-right: 12px; }
      .logo .icon-mark { display: none; }
      .version-badge { margin-bottom: 0; margin-right: auto; }
      .nav-btn { width: auto; padding: 8px 14px; font-size: 13px; }
      .nav-btn .icon { font-size: 16px; width: 20px; }
      .nav-btn.active::after { display: none; }
      .main { padding: 20px; gap: 14px; }
      .page-title { font-size: 22px; flex-wrap: wrap; }
      .preview-item { width: 90px; }
      input[type="range"] { width: 120px; }
      body { padding: 12px; }
      .btn { padding: 8px 16px; font-size: 12px; min-width: fit-content; }
      select { min-width: 100px; padding: 8px 16px; min-height: 40px; }
      .radio-group label { font-size: 12px; padding: 3px 4px; }
      .checkbox-group label { font-size: 12px; padding: 3px 4px; }
    }
    @media (max-width: 480px) {
      .card { padding: 14px; }
      .btn { padding: 8px 14px; font-size: 12px; }
      .app { border-radius: 24px; }
      body { padding: 8px; }
      .btn-group { gap: 8px; }
      select { min-width: 80px; font-size: 12px; padding: 6px 14px; min-height: 36px; }
    }
  </style>
</head>
<body>
<!-- 额外浮动彩色光晕 -->
<div class="glow-orbe-1"></div>
<div class="glow-orbe-2"></div>

<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="logo">
      ✦ 图图
      <span class="accent">v1.1.7</span>
      <span class="icon-mark"></span>
    </div>
    <div class="version-badge">幻彩 · 轻享</div>
    <button class="nav-btn active" data-page="bw"><span class="icon">🎨</span> 彩色转黑白</button>
    <button class="nav-btn" data-page="format"><span class="icon">🔄</span> 格式转换</button>
    <button class="nav-btn" data-page="ocr"><span class="icon">📝</span> OCR 重命名</button>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-footer">⚡ 本地处理 · 零上传</div>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <div class="page-title">
      <span id="pageTitle">🎨 彩色转黑白</span>
      <span class="glow">✦ 实时预览</span>
    </div>

    <!-- 文件卡片 -->
    <div class="card">
      <div class="card-title"><span class="badge-dot"></span> 文件工坊</div>
      <div class="file-drop-area" id="dropArea">
        <span class="icon-big">⬆</span>
        <div class="hint">点击上传 或 拖拽图片至此处</div>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="selectBtn">✦ 选择文件</button>
        <button class="btn btn-outline" id="clearBtn">✕ 清空</button>
      </div>
      <div class="file-count" id="fileCount">◈ 已选择 0 个文件</div>
      <div class="file-list" id="fileList"></div>
    </div>

    <!-- 参数卡片 -->
    <div class="card" id="paramCard"></div>

    <!-- 操作 & 预览卡片 -->
    <div class="card" style="flex-shrink: 0;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
        <button class="btn btn-primary" id="actionBtn" style="padding:12px 36px; font-size:14.5px;">✦ 开始处理</button>
        <button class="btn btn-outline" id="downloadAllBtn">📦 打包下载 (ZIP)</button>
        <span style="margin-left:auto; font-size:12px; color:#8f7a8b;" id="resultCount">等待处理</span>
      </div>
      <div id="previewContainer" class="preview-area">
        <div class="empty-preview">✦ 处理后，预览将在此显现</div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="left"><span class="status-dot" id="statusDot"></span> <span id="statusText">就绪 · 等待文件</span></span>
      <span>✦ 2026 图图 · 幻彩</span>
    </div>
  </main>
</div>

<script>
// ============================================================
//  全局状态 (逻辑完全不变)
// ============================================================
let files = [];
let processedBlobs = [];
let processedNames = [];
let currentFunc = 'bw';

const pageTitle = document.getElementById('pageTitle');
const fileInput = document.getElementById('fileInput');
const dropArea = document.getElementById('dropArea');
const fileListEl = document.getElementById('fileList');
const fileCount = document.getElementById('fileCount');
const paramCard = document.getElementById('paramCard');
const previewContainer = document.getElementById('previewContainer');
const actionBtn = document.getElementById('actionBtn');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const statusText = document.getElementById('statusText');
const statusDot = document.getElementById('statusDot');
const resultCount = document.getElementById('resultCount');

// ---- 导航 ----
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFunc = this.dataset.page;
    const titles = {
      bw: '🎨 彩色转黑白',
      format: '🔄 图片格式转换',
      ocr: '📝 OCR 智能重命名'
    };
    pageTitle.innerHTML = `${titles[currentFunc]} <span class="glow">✦ 实时预览</span>`;
    renderParams();
    clearProcessed();
    updateStatus('就绪', false);
  });
});

// ---- 文件 ----
function addFiles(newFiles) {
  for (const f of newFiles) {
    if (!f.type.startsWith('image/')) continue;
    const exists = files.some(ex => ex.name === f.name && ex.size === f.size);
    if (!exists) files.push(f);
  }
  renderFileList();
  clearProcessed();
  updateStatus(`已添加 ${newFiles.length} 个文件`, false);
}

dropArea.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) addFiles(Array.from(e.target.files));
  e.target.value = '';
});
dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
});
document.getElementById('selectBtn').addEventListener('click', () => fileInput.click());
document.getElementById('clearBtn').addEventListener('click', () => { files = []; renderFileList(); clearProcessed(); updateStatus('已清空', false); });

function renderFileList() {
  fileListEl.innerHTML = files.map(f =>
    `<div class="file-item"><span>${f.name}</span><span class="size">${(f.size/1024).toFixed(1)} KB</span></div>`
  ).join('');
  fileCount.textContent = `◈ 已选择 ${files.length} 个文件`;
}

// ---- 参数渲染 ----
function renderParams() {
  if (currentFunc === 'bw') {
    paramCard.innerHTML = `
      <div class="param-row">
        <span class="param-label">◈ 转换模式</span>
        <div class="radio-group">
          <label><input type="radio" name="bwMode" value="strong" checked> 强对比度</label>
          <label><input type="radio" name="bwMode" value="normal"> 普通灰度</label>
        </div>
      </div>
      <div class="param-row">
        <span class="param-label">◈ 阈值（强对比度）</span>
        <div style="display:flex;align-items:center;gap:14px;">
          <input type="range" id="thresholdSlider" min="0" max="255" value="128">
          <span class="range-value" id="thresholdVal">128</span>
        </div>
      </div>
      <div class="checkbox-group">
        <label><input type="checkbox" id="autoCrop"> ✦ 自动裁切边缘（去白边）</label>
      </div>
      <div class="hint-text">💡 适合白底黑字签名 / 文档增强</div>
    `;
    document.getElementById('thresholdSlider')?.addEventListener('input', function() {
      document.getElementById('thresholdVal').textContent = this.value;
    });
  } else if (currentFunc === 'format') {
    paramCard.innerHTML = `
      <div class="param-row">
        <span class="param-label">◈ 输出格式</span>
        <select id="formatSelect">
          <option value="png">PNG</option>
          <option value="jpeg">JPG</option>
          <option value="webp">WEBP</option>
          <option value="bmp">BMP</option>
          <option value="gif">GIF</option>
          <option value="tiff">TIFF</option>
        </select>
      </div>
      <div class="param-row">
        <span class="param-label">◈ 图片质量</span>
        <div class="radio-group">
          <label><input type="radio" name="quality" value="best"> 极致</label>
          <label><input type="radio" name="quality" value="medium" checked> 均衡</label>
          <label><input type="radio" name="quality" value="low"> 高效</label>
        </div>
      </div>
    `;
  } else if (currentFunc === 'ocr') {
    paramCard.innerHTML = `
      <div style="padding:4px 0;">
        <p style="font-size:14px;color:#3d2b3a;margin-bottom:12px;font-weight:400;">
          ✦ 利用 Tesseract.js 本地识别，文字提取后支持自定义重命名下载。
        </p>
        <div style="background:rgba(255,255,255,0.05);padding:12px 16px;border-radius:16px;font-size:13px;color:#6f5a6b;border-left:3px solid #b9a6f0;">
          ⚠️ 手写体准确率受限，建议预先转黑白增强对比。
        </div>
        <div class="param-row" style="margin-top:14px;">
          <span class="param-label">◈ 识别语言</span>
          <select id="ocrLang">
            <option value="chi_sim">中文简体</option>
            <option value="eng">英文</option>
            <option value="chi_tra">中文繁体</option>
          </select>
        </div>
      </div>
    `;
  }
  clearProcessed();
}

// ---- 核心处理 (稳定) ----
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function convertToBW(imageData, mode, threshold) {
  const canvas = document.createElement('canvas');
  canvas.width = imageData.width;
  canvas.height = imageData.height;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(imageData, 0, 0);
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = data.data;
  for (let i = 0; i < pixels.length; i += 4) {
    let r = pixels[i], g = pixels[i+1], b = pixels[i+2];
    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
    if (mode === 'strong') {
      let val = gray > threshold ? 255 : 0;
      pixels[i] = pixels[i+1] = pixels[i+2] = val;
    } else {
      pixels[i] = pixels[i+1] = pixels[i+2] = gray;
    }
  }
  ctx.putImageData(data, 0, 0);
  return canvas;
}

function autoCropCanvas(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  let left = w, right = 0, top = h, bottom = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      if (data[idx] < 250 || data[idx+1] < 250 || data[idx+2] < 250) {
        if (x < left) left = x;
        if (x > right) right = x;
        if (y < top) top = y;
        if (y > bottom) bottom = y;
      }
    }
  }
  if (left === w && top === h) return canvas;
  const pad = 2;
  left = Math.max(0, left - pad); top = Math.max(0, top - pad);
  right = Math.min(w, right + pad + 1); bottom = Math.min(h, bottom + pad + 1);
  const cropped = document.createElement('canvas');
  cropped.width = right - left;
  cropped.height = bottom - top;
  const croppedCtx = cropped.getContext('2d');
  croppedCtx.drawImage(canvas, left, top, cropped.width, cropped.height, 0, 0, cropped.width, cropped.height);
  return cropped;
}

function convertFormat(canvas, format, quality) {
  const mime = `image/${format}`;
  let opts = {};
  if (format === 'jpeg' || format === 'webp') opts.quality = quality / 100;
  return new Promise((resolve) => canvas.toBlob(resolve, mime, opts.quality));
}

async function ocrImage(img, lang = 'chi_sim') {
  const { data: { text } } = await Tesseract.recognize(img, lang, { logger: m => console.log(m) });
  return text.trim();
}

// ---- 主处理 ----
actionBtn.addEventListener('click', async function() {
  if (files.length === 0) { alert('✦ 请先选择图片文件'); return; }
  actionBtn.disabled = true;
  actionBtn.textContent = '⏳ 处理中...';
  updateStatus('处理中...', true);

  try {
    processedBlobs = [];
    processedNames = [];

    if (currentFunc === 'bw') {
      const mode = document.querySelector('input[name="bwMode"]:checked')?.value || 'strong';
      const threshold = parseInt(document.getElementById('thresholdSlider')?.value || 128);
      const autoCropEnabled = document.getElementById('autoCrop')?.checked || false;

      for (const file of files) {
        const img = await loadImage(file);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let bwCanvas = convertToBW(imageData, mode, threshold);
        if (autoCropEnabled) bwCanvas = autoCropCanvas(bwCanvas);
        const blob = await new Promise(resolve => bwCanvas.toBlob(resolve, 'image/png'));
        processedBlobs.push(blob);
        processedNames.push(file.name.replace(/\.[^.]+$/, '') + '_bw.png');
      }
    } else if (currentFunc === 'format') {
      const format = document.getElementById('formatSelect').value;
      const qualityRadio = document.querySelector('input[name="quality"]:checked');
      const qualityMap = { best: 95, medium: 75, low: 50 };
      const quality = qualityMap[qualityRadio?.value || 'medium'];

      for (const file of files) {
        const img = await loadImage(file);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const blob = await convertFormat(canvas, format, quality);
        processedBlobs.push(blob);
        processedNames.push(file.name.replace(/\.[^.]+$/, '') + '.' + format);
      }
    } else if (currentFunc === 'ocr') {
      const lang = document.getElementById('ocrLang')?.value || 'chi_sim';
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const img = await loadImage(file);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        let text = '';
        try { text = await ocrImage(canvas, lang); } catch (e) { text = 'OCR失败'; }
        let clean = text.replace(/[\n\r]/g, '').replace(/[\\/:*?"<>|]/g, '').trim();
        if (clean.length === 0) clean = '未识别';
        if (clean.length > 50) clean = clean.slice(0, 50);
        const newBase = prompt(`✦ 请输入 "${file.name}" 的新文件名（不含扩展）`, clean);
        if (newBase === null) continue;
        const finalName = (newBase.trim() || '未命名') + '.png';
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        processedBlobs.push(blob);
        processedNames.push(finalName);
      }
    }

    renderPreviews();
    resultCount.textContent = `✦ 生成 ${processedBlobs.length} 个文件`;
    updateStatus('处理完成 ✦', false);

  } catch (err) {
    alert('处理出错：' + err.message);
    updateStatus('出错', false);
  } finally {
    actionBtn.disabled = false;
    actionBtn.textContent = '✦ 开始处理';
  }
});

// ---- 预览 & 下载 ----
function renderPreviews() {
  previewContainer.innerHTML = '';
  if (processedBlobs.length === 0) {
    previewContainer.innerHTML = '<div class="empty-preview">✦ 处理后，预览将在此显现</div>';
    return;
  }
  processedBlobs.forEach((blob, idx) => {
    const url = URL.createObjectURL(blob);
    const div = document.createElement('div');
    div.className = 'preview-item';
    div.innerHTML = `<img src="${url}" alt="预览"><div class="pname">${processedNames[idx]}</div>`;
    previewContainer.appendChild(div);
  });
}

function clearProcessed() {
  processedBlobs = [];
  processedNames = [];
  previewContainer.querySelectorAll('img').forEach(img => {
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
  });
  previewContainer.innerHTML = '<div class="empty-preview">✦ 处理后，预览将在此显现</div>';
  resultCount.textContent = '等待处理';
}

downloadAllBtn.addEventListener('click', function() {
  if (processedBlobs.length === 0) { alert('✦ 请先处理图片'); return; }
  const zip = new JSZip();
  processedBlobs.forEach((blob, i) => zip.file(processedNames[i] || `image_${i+1}.png`, blob));
  zip.generateAsync({ type: 'blob' }).then((content) => {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = '图图_幻彩批量.zip';
    link.click();
    URL.revokeObjectURL(link.href);
  });
});

function updateStatus(text, active = false) {
  statusText.textContent = text;
  if (active) {
    statusDot.classList.add('active');
  } else {
    statusDot.classList.remove('active');
  }
}

// ---- 初始化 ----
renderParams();
updateStatus('就绪 · 等待文件', false);
</script>
</body>
</html>
